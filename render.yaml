# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# You'll be prompted for the values marked `sync: false`.
databases:
  - name: ai-job-assistant-db
    plan: free

services:
  - type: web
    name: ai-job-assistant-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.services.embeddings
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-job-assistant-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Frontend URL, e.g. https://ai-job-assistant-web.onrender.com
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: ai-job-assistant-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backend URL, e.g. https://ai-job-assistant-api.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
